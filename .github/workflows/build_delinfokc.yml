name: Build DelInfoKC iOS
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile DelInfoKC with Xcode iOS SDK
        run: |
          xcrun -sdk iphoneos clang -arch arm64 -miphoneos-version-min=14.0 -fobjc-arc -O2 -framework Foundation -framework Security -o DelInfoKC DelInfoKC.m
          codesign -f -s - --entitlements delinfokc_ent.plist DelInfoKC
          codesign -d --entitlements - DelInfoKC
      - uses: actions/upload-artifact@v4
        with:
          name: DelInfoKC
          path: DelInfoKC

